<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Download to IINA</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icon.svg" alt="" width="20" height="20">
    <h1>Download to IINA</h1>
    <button id="preferences" type="button">Preferences</button>
    <a href="https://github.com/justinluque/download-to-iina#troubleshooting" target="_blank" rel="noreferrer" aria-label="Setup and help" title="Setup and help">?</a>
  </header>
  <main>
    <p id="error" role="alert" hidden></p>
    <div id="notice" role="status" hidden></div>
    <div id="jobs"></div>
    <p id="empty">Starting download…</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
